<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Taskly: plan the day, focus, get it done. A minimal to-do app whose tasks stay in your browser." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0B0C0B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Taskly</title>
    <!-- Runs before first paint so a saved theme never flashes the wrong one. Default is dark. -->
    <script>
      var pref
      try { pref = JSON.parse(localStorage.getItem("taskly.theme")) } catch (e) {}
      document.documentElement.dataset.theme =
        pref === "light" || pref === "dark" ? pref
        : pref === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : "dark"
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
